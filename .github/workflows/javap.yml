# Prints class signatures of Minecraft / Fabric API / mod classes, to look up the API of this Minecraft version.
name: javap
on:
  push:
    branches: [javap]

jobs:
  javap:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: storagedim-tb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          path: jp
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava
      - name: javap
        run: |
          CP=$(find ~/.gradle /home/runner/work -name "*.jar" \( -path "*minecraft*" -o -path "*fabric-api*" -o -path "*net.fabricmc*" -o -path "*maven.modrinth*" \) 2>/dev/null | tr '\n' ':')
          while read -r flags cls; do
            [ -z "$cls" ] && continue
            echo "=================== $cls"
            javap $flags -cp "$CP" "$cls" 2>&1 | head -4000
          done < ../jp/tools/javap-classes.txt
      - name: TB details
        run: |
          JAR=$(find ~/.gradle -iname "travelersbackpack*.jar" | grep -v sources | head -1)
          mkdir /tmp/tb && cd /tmp/tb && unzip -q "$JAR"
          MC=".:$(find ~/.gradle /home/runner/work -name '*.jar' \( -path '*minecraft*' -o -path '*fabric*' -o -path '*modrinth*' \) | tr '\n' ':')"
          echo "=== jei/compat classes"; find . -iname "*.class" | grep -iE "jei|compat" | head -60
          echo "=== entrypoints"; cat fabric.mod.json | head -80
          for m in openBackpackFromSlot openBackpackSettings; do
            echo "=== ServerActions.$m"; javap -c -p -cp "$MC" com.tiviacz.travelersbackpack.common.ServerActions | sed -n "/ $m(/,/^$/p" | head -150
          done
          echo "=== BackpackContainer.openBackpack"; javap -c -p -cp "$MC" com.tiviacz.travelersbackpack.inventory.BackpackContainer | sed -n "/ openBackpack(/,/^$/p" | head -200
          echo "=== ServerboundActionTagPacket"; javap -c -p -cp "$MC" com.tiviacz.travelersbackpack.network.ServerboundActionTagPacket | grep -nE "OPEN_|invokestatic|getstatic|tableswitch|lookupswitch|: [0-9]+$" | head -200
          echo "=== Reference consts"; javap -constants -p -cp "$MC" com.tiviacz.travelersbackpack.util.Reference | head -20
