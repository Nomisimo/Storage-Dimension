# Prints class signatures of Minecraft / Fabric API classes, to look up the API of this Minecraft version.
name: javap
on:
  push:
    branches: [javap]

jobs:
  javap:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: storagedim-tb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava
      - name: TB jar contents
        run: |
          JAR=$(find ~/.gradle -iname "*travelersbackpack*.jar" | grep -v sources | head -1)
          echo "JAR=$JAR"
          for f in data/travelersbackpack/tags/item/backpack_upgrades.json data/travelersbackpack/tags/item/readme.txt; do echo "== $f"; unzip -p "$JAR" "$f"; echo; done
          unzip -l "$JAR" | grep -iE "UpgradeSlot|upgrade/UpgradeItem|BackpackSlot" | head
          mkdir x && cd x && unzip -q "$JAR" && javap -p -cp . com.tiviacz.travelersbackpack.inventory.menu.slot.UpgradeSlotItemHandler 2>&1 | head -40 || true
          grep -rl "backpack_upgrades" --include=*.class . | head
