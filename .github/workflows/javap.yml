# Prints class signatures of Minecraft / Fabric API / mod classes, to look up the API of this Minecraft version.
name: javap
on:
  push:
    branches: [javap]

jobs:
  javap:
    runs-on: ubuntu-24.04
    steps:
      - name: modrinth versions
        run: |
          curl -s 'https://api.modrinth.com/v2/project/jei/version?game_versions=%5B%2226.1.2%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[] | "\(.id) \(.version_number) \(.files[0].filename)"' | head -20
