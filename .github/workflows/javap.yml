# Prints class signatures of Minecraft / Fabric API / mod classes, to look up the API of this Minecraft version.
name: javap
on:
  push:
    branches: [javap]

jobs:
  javap:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: storagedim-tb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          path: jp
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava
      - name: javap
        run: |
          CP=$(find ~/.gradle /home/runner/work -name "*.jar" \( -path "*minecraft*" -o -path "*fabric-api*" -o -path "*net.fabricmc*" -o -path "*maven.modrinth*" \) 2>/dev/null | tr '\n' ':')
          while read -r flags cls; do
            [ -z "$cls" ] && continue
            echo "=================== $cls"
            javap $flags -cp "$CP" "$cls" 2>&1 | head -4000
          done < ../jp/tools/javap-classes.txt
      - name: Fabric menu classes
        run: |
          for j in $(find ~/.gradle -name "*.jar" -path "*fabric*" | grep -v sources); do unzip -l "$j" 2>/dev/null | grep -iE "MenuType|ScreenHandler|MenuScreen|menu/v1|screenhandler" | awk -v j="$(basename $j)" '{print j": "$4}'; done | sort -u | head -60
          unzip -p $(find ~/.gradle -name "*.jar" -path "*fabric*" | grep -i "transitive\|fabric-api-base\|fabric-screen-handler\|fabric-menu" | head -3 | tr '\n' ' ') "*.accesswidener" "*.classtweaker" 2>/dev/null | grep -i "MenuScreens\|MenuType" | head
          for j in $(find ~/.gradle -name "*.jar" -path "*fabric*" | grep -v sources); do unzip -l "$j" 2>/dev/null | grep -iE "accesswidener|classtweaker" | awk -v j="$j" '{print j" "$4}'; done | head -30
          JADE="/tmp/jade.jar"
          curl -sL -o $JADE "https://cdn.modrinth.com/data/nvQzSEkH/versions/Yo9xOce3/Jade-mc26.1-Fabric-26.1.11.jar"
          MC="$JADE:$(find ~/.gradle /home/runner/work -name '*.jar' \( -path '*minecraft*' -o -path '*fabric*' \) | tr '\n' ':')"
          for c in snownee.jade.api.IJadeProvider snownee.jade.api.BlockAccessor snownee.jade.api.IBlockComponentProvider; do echo "=================== $c"; javap -cp "$MC" $c 2>&1 | head -60; done
      - name: TB screen render
        run: |
          JAR=$(find ~/.gradle -iname "travelersbackpack*.jar" | grep -v sources | head -1)
          mkdir /tmp/tb && cd /tmp/tb && unzip -q "$JAR"
          MC=".:$(find ~/.gradle /home/runner/work -name '*.jar' \( -path '*minecraft*' -o -path '*fabric*' -o -path '*modrinth*' \) | tr '\n' ':')"
          for c in com.tiviacz.travelersbackpack.client.screens.BackpackScreen; do
            for m in extractRenderState extractBackground extractLabels init mouseClicked keyPressed charTyped; do
              echo "=== $c.$m"; javap -c -p -cp "$MC" $c | sed -n "/ $m(/,/^$/p" | grep -E "invoke|Code|$m" | head -60
            done
          done
