# Prints class signatures of Minecraft / Fabric API / mod classes, to look up the API of this Minecraft version.
name: javap
on:
  push:
    branches: [javap]

jobs:
  javap:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: storagedim-tb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          path: jp
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava
      - name: javap
        run: |
          CP=$(find ~/.gradle /home/runner/work -name "*.jar" \( -path "*minecraft*" -o -path "*fabric-api*" -o -path "*net.fabricmc*" -o -path "*maven.modrinth*" \) 2>/dev/null | tr '\n' ':')
          while read -r flags cls; do
            [ -z "$cls" ] && continue
            echo "=================== $cls"
            javap $flags -cp "$CP" "$cls" 2>&1 | head -4000
          done < ../jp/tools/javap-classes.txt
      - name: TB details
        run: |
          JAR=$(find ~/.gradle -iname "travelersbackpack*.jar" | grep -v sources | head -1)
          mkdir /tmp/tb && cd /tmp/tb && unzip -q "$JAR"
          ls data/travelersbackpack/recipe | head -80
