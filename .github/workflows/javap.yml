# Prints class signatures of Minecraft / Fabric API / mod classes, to look up the API of this Minecraft version.
name: javap
on:
  push:
    branches: [javap]

jobs:
  javap:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: storage-dimension
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          path: jp
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava compileGametestJava
      - name: javap
        run: |
          CP=$(find ~/.gradle /home/runner/work -name "*.jar" \( -path "*minecraft*" -o -path "*fabric-api*" -o -path "*net.fabricmc*" -o -path "*maven.modrinth*" \) 2>/dev/null | tr '\n' ':')
          while read -r flags cls; do
            [ -z "$cls" ] && continue
            echo "=================== $cls"
            javap $flags -cp "$CP" "$cls" 2>&1 | head -4000
          done < ../jp/tools/javap-classes.txt
      - name: Data files
        run: |
          MC=$(find ~/.gradle -name "minecraft-*merged*.jar" -o -name "minecraft-common*.jar" -o -name "minecraft-client*.jar" | grep -v sources | head -5)
          echo "$MC"
          for j in $MC; do unzip -l "$j" | grep -E "dimension_type/|data/minecraft/dimension/" | head; done
          J=$(for j in $MC; do unzip -l "$j" | grep -q "dimension_type/the_end.json" && echo $j; done | head -1)
          echo "== jar $J"
          unzip -p "$J" data/minecraft/dimension_type/the_end.json; echo; unzip -p "$J" data/minecraft/dimension_type/overworld.json; echo
          find ~/.gradle -name "fabric-rendering-v1*.jar" | head -2
          FR=$(find ~/.gradle -name "fabric-rendering-v1*.jar" | grep -v sources | head -1); unzip -l "$FR" | grep -i -E "sky|dimension" | head -20
