# Prints class signatures of Minecraft / Fabric API classes, to look up the API of this Minecraft version.
name: javap
on:
  push:
    branches: [javap]

jobs:
  javap:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: storagedim-tb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava
      - name: TB jar contents
        run: |
          JAR=$(find ~/.gradle -iname "*travelersbackpack*.jar" | grep -v sources | head -1)
          echo "JAR=$JAR"
          unzip -l "$JAR" | grep -iE "recipe/.*upgrade|blank|lang/en_us" | head -80
          unzip -p "$JAR" fabric.mod.json | head -40
          unzip -p "$JAR" $(unzip -l "$JAR" | grep -o "assets/travelersbackpack/lang/en_us.json") | tr ',' '\n' | grep -i upgrade | head -60
          for f in $(unzip -l "$JAR" | grep -oE "data/travelersbackpack/recipe/[a-z_]*upgrade[a-z_]*\.json" | head -6); do echo "== $f"; unzip -p "$JAR" "$f"; done
          unzip -p "$JAR" $(unzip -l "$JAR" | grep -oE "data/travelersbackpack/tags/item/[a-z_/]*upgrade[a-z_]*\.json" | head -3) || true
          unzip -l "$JAR" | grep -i "tags/item" | head -40
