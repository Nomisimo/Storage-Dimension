# Prints class signatures of Minecraft / Fabric API / mod classes, to look up the API of this Minecraft version.
name: javap
on:
  push:
    branches: [javap]

jobs:
  javap:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: storagedim-tb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          path: jp
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava
      - name: javap
        run: |
          CP=$(find ~/.gradle /home/runner/work -name "*.jar" \( -path "*minecraft*" -o -path "*fabric-api*" -o -path "*net.fabricmc*" -o -path "*maven.modrinth*" \) 2>/dev/null | tr '\n' ':')
          while read -r flags cls; do
            [ -z "$cls" ] && continue
            echo "=================== $cls"
            javap $flags -cp "$CP" "$cls" 2>&1 | head -4000
          done < ../jp/tools/javap-classes.txt
      - name: Xaero
        run: |
          for p in xaeros-minimap xaeros-world-map; do
            URL=$(curl -s "https://api.modrinth.com/v2/project/$p/version?game_versions=%5B%2226.1.2%22%5D&loaders=%5B%22fabric%22%5D" | python3 -c "import json,sys; v=json.load(sys.stdin)[0]; print(v['files'][0]['url']); import sys as s; s.stderr.write(v['version_number']+' '+v['id']+'\\n')")
            echo "== $p $URL"; curl -sL -o /tmp/$p.jar "$URL"
            unzip -l /tmp/$p.jar | grep -iE "entity/icon|icon/def|icon/sprite|/icon" | head -40
            unzip -l /tmp/$p.jar | grep -iE "assets/.*(chicken|cow)" | head -10
          done
          cd /tmp && mkdir x && cd x && unzip -q /tmp/xaeros-minimap.jar
          for f in $(find . -path "*entity/icon/definition*" -name "*.json" | grep -iE "chicken|cow|zombie|allay" | head -4); do echo "--- $f"; cat $f; echo; done
          find . -path "*entity/icon*" | head -20
      - name: TB screen render
        run: |
          JAR=$(find ~/.gradle -iname "travelersbackpack*.jar" | grep -v sources | head -1)
          mkdir /tmp/tb && cd /tmp/tb && unzip -q "$JAR"
          MC=".:$(find ~/.gradle /home/runner/work -name '*.jar' \( -path '*minecraft*' -o -path '*fabric*' -o -path '*modrinth*' \) | tr '\n' ':')"
          for c in com.tiviacz.travelersbackpack.client.screens.BackpackScreen com.tiviacz.travelersbackpack.client.screens.AbstractBackpackScreen; do
            for m in renderScreen extractTooltip mouseClicked; do
              echo "=== $c.$m"; javap -c -p -cp "$MC" $c | sed -n "/ $m(/,/^$/p" | grep -E "invoke|Code|getfield|putfield|$m" | head -120
            done
          done
