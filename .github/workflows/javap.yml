# Prints class signatures of Minecraft / Fabric API / mod classes, to look up the API of this Minecraft version.
name: javap
on:
  push:
    branches: [javap]

jobs:
  javap:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: storage-dimension
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          path: jp
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava compileGametestJava
      - name: javap
        run: |
          CP=$(find ~/.gradle /home/runner/work -name "*.jar" \( -path "*minecraft*" -o -path "*fabric-api*" -o -path "*net.fabricmc*" -o -path "*maven.modrinth*" \) 2>/dev/null | tr '\n' ':')
          while read -r flags cls; do
            [ -z "$cls" ] && continue
            echo "=================== $cls"
            javap $flags -cp "$CP" "$cls" 2>&1 | head -4000
          done < ../jp/tools/javap-classes.txt
      - name: Xaero config keys
        run: |
          JAR=$(find ~/.gradle -path "*xaeros-minimap*" -name "*.jar" | grep -v sources | head -1)
          echo "jar=$JAR"
          mkdir -p /tmp/xa && cd /tmp/xa && unzip -q -o "$JAR"
          find . -name "*.cfg" -o -name "*.txt" -o -name "*.json" | grep -iv lang | head -40
          for f in $(grep -rl -a -i "radar" --include=*.class . | head -60); do strings -n 6 "$f" | grep -i -E "icon|radar|dot|display" | sed "s|^|$f: |" | head -15; done | grep -i -E "icon|dot" | sort -u | head -150
