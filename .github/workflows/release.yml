# Started by hand (Actions → release → Run workflow). Creates a GitHub release from the latest jars on the
# "builds" branch, with the install notes from .github/release-notes.md. The barden jar is left out on purpose.
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v0.6.0'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fetch built jars
        run: |
          git fetch --depth 1 origin builds
          mkdir out
          for f in $(git ls-tree --name-only origin/builds); do
            case "$f" in barden-*) continue ;; esac
            git show "origin/builds:$f" > "out/$f"
          done
          ls -l out
          # The builds branch must already hold the jars of this version (the build on main may still be running).
          VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"
          if [ ! -f "out/storage-dimension-$VERSION.jar" ]; then
            echo "::error::Auf dem builds-Branch liegt noch kein storage-dimension-$VERSION.jar. Erst den Build auf main abwarten, dann den Release neu starten."
            exit 1
          fi
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          TITLE="Storage Dimension $TAG (MC 26.1.2)"
          # Running it again for the same tag refreshes that release with the newest jars instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Drop jars of another version that an earlier run attached.
            for old in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              [ -f "out/$old" ] || gh release delete-asset "$TAG" "$old" --yes
            done
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file .github/release-notes.md
          fi
