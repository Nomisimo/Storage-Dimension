# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mod: [storage-dimension, barden, storagedim-tb]
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: server smoke test
        if: matrix.mod != 'storagedim-tb'
        env:
          STORAGEDIM_SMOKETEST: 'true'
          BARDEN_SMOKETEST: 'true'
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          timeout 900 ./gradlew runServer --args="nogui" 2>&1 | tee server.log
          grep -q "SMOKETEST OK" server.log
      - name: build modrinth pack
        if: matrix.mod == 'storage-dimension'
        run: |
          jar=$(ls build/libs/storage-dimension-*.jar | grep -v sources)
          python3 ../tools/build_mrpack.py "$jar" build/libs/storage-dimension.mrpack
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mod }}
          path: ${{ matrix.mod }}/build/libs/

  # Puts the finished jars on the "builds" branch, so they can be fetched with plain git.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: push jars to builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          find artifacts -type f \( -name '*.jar' -o -name '*.mrpack' \) ! -name '*-sources.jar' -exec cp {} out/ \;
          ls -l out
          cd out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:builds
