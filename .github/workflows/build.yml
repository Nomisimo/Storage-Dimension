# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mod: [storage-dimension, barden]
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: server smoke test
        env:
          STORAGEDIM_SMOKETEST: 'true'
          BARDEN_SMOKETEST: 'true'
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          timeout 900 ./gradlew runServer --args="nogui" 2>&1 | tee server.log
          grep -q "SMOKETEST OK" server.log
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mod }}
          path: ${{ matrix.mod }}/build/libs/
