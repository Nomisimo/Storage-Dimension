# Starts the real game client once, builds a small scene with the mod's chests and robot,
# and puts the screenshots on the "screenshots" branch.
name: client-test
on:
  push:
    branches: [main]
    paths: ['storage-dimension/**']
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: storage-dimension
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - run: chmod +x ./gradlew
      - name: run client game test
        run: timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest 2>&1 | tee client.log
      - name: publish screenshots
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/shots
          find storage-dimension -path "*screenshots*" -name "*.png" -exec cp {} /tmp/shots/ \; || true
          tail -300 storage-dimension/client.log > /tmp/shots/client-log-tail.txt || true
          grep -iE "error|exception|mixin|storagedim|STORAGEDIM ROBOT|STORAGEDIM DRAG" storage-dimension/client.log | head -300 > /tmp/shots/client-log-errors.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rf --quiet . || true
          cp /tmp/shots/* .
          git add -A
          git commit -m "Screenshots for ${GITHUB_SHA}" || true
          git push -f origin screenshots
